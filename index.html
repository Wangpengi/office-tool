<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态规则精准排版系统 - 完美修复版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f1f5f9; }
        .preview-container { 
            background: white; 
            border: 1px solid #cbd5e1; 
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.03); 
            padding: 40px; 
            min-height: 500px; 
            max-height: 700px;
            overflow-y: auto;
        }
        .toast-enter { animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="p-4 md:p-8 text-slate-800">
    <div class="max-w-7xl mx-auto flex flex-col gap-8">
        
        <div class="text-center space-y-2 mb-2">
            <h1 class="text-3xl font-black text-slate-900 tracking-tight">智能论文排版系统 <span class="bg-indigo-600 text-white text-sm px-3 py-1 rounded-full align-middle ml-2 shadow-sm">修复版 V3</span></h1>
            <p class="text-slate-500 font-medium">完美解决摘要、关键词内容异常加粗问题，支持块级与行内双重渲染</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <!-- 步骤 1 & 2 -->
            <div class="space-y-6">
                <!-- Step 1 -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2 mb-4">
                        <span class="bg-blue-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-sm shadow">1</span> 
                        输入格式要求
                    </h2>
                    <textarea id="rules-input" class="w-full h-48 p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm resize-none text-slate-600 leading-relaxed font-mono">1.标题：论文标题黑体三号，居中，段前段后0.5行，行距固定值22磅；
一级标题宋体小三加粗，顶格左对齐，段前段后0.5行，行距固定值22磅；
二级标题宋体四号加粗，顶格左对齐，行距固定值22磅；
三级标题宋体小四，首行缩进2字符，行距固定值22磅。
2.作者及单位：作者姓名宋体四号，居中；下方“（学院+方向）”宋体四号，居中。
3.摘要：黑体五号加粗，内容楷体五号，行距固定值22磅。
4.关键词：黑体五号加粗，内容楷体五号，各词间用“；”隔开，行距固定值22磅。
5.正文：与关键词空一行，宋体小四，首行缩进2字符，行距固定值22磅。
6.参考文献：宋体小五，页下注释。</textarea>
                    <div class="mt-4">
                        <input type="text" id="topic-input" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm mb-3" placeholder="请输入论文题目（如：树立正确的中华民族历史观）">
                        <button onclick="generatePrompt()" class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg font-bold hover:bg-blue-700 transition shadow flex items-center justify-center gap-2">
                            生成 AI 专属提示词
                        </button>
                    </div>
                </div>

                <!-- Step 2 -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2 mb-4">
                        <span class="bg-indigo-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-sm shadow">2</span> 
                        复制提示词给 AI
                    </h2>
                    <textarea id="generated-prompt" class="w-full h-40 p-3 bg-indigo-50 border border-indigo-100 rounded-lg focus:outline-none font-mono text-xs resize-none text-indigo-900" readonly placeholder="请先在上方点击生成..."></textarea>
                    <button onclick="copyPrompt()" class="mt-4 w-full bg-slate-800 text-white py-3 px-4 rounded-lg font-bold hover:bg-slate-900 transition shadow">
                        一键复制提示词
                    </button>
                </div>
            </div>

            <!-- 步骤 3 & 4 -->
            <div class="space-y-6">
                <!-- Step 3 -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2 mb-4">
                        <span class="bg-violet-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-sm shadow">3</span> 
                        粘贴 AI 生成的文章内容
                    </h2>
                    <textarea id="ai-output" class="w-full h-48 p-4 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-violet-500 focus:outline-none font-mono text-sm resize-none text-slate-700 leading-relaxed" placeholder="在此粘贴带有 [注：...] 标签和 **加粗** 语法的 AI 回复文本..."></textarea>
                    <button onclick="parseText()" class="mt-4 w-full bg-violet-600 text-white py-3 px-6 rounded-lg font-bold hover:bg-violet-700 transition shadow flex justify-center items-center gap-2">
                        渲染最终 Word 排版
                    </button>
                </div>

                <!-- Step 4 -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                            <span class="bg-emerald-500 text-white w-6 h-6 rounded-full flex items-center justify-center text-sm shadow">4</span>
                            排版预览与导出
                        </h2>
                        <button onclick="copyToWord()" class="bg-emerald-500 text-white px-4 py-2 rounded-lg font-bold hover:bg-emerald-600 transition shadow flex items-center gap-2 text-sm">
                            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" /></svg>
                            复制到 Word
                        </button>
                    </div>
                    
                    <div id="word-preview" class="preview-container rounded-xl">
                        <div id="placeholder-text" class="text-slate-400 text-center mt-20 flex flex-col items-center">
                            等待解析...
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <!-- 弹窗通知容器 -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div>

    <script>
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'error' ? 'bg-rose-600' : 'bg-emerald-600';
            toast.className = `${bgColor} text-white px-6 py-3 rounded-lg shadow-xl font-medium toast-enter text-sm`;
            toast.innerHTML = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // 步骤 1：生成 Prompt
        function generatePrompt() {
            const rules = document.getElementById('rules-input').value.trim();
            const topic = document.getElementById('topic-input').value.trim() || "[论文题目未指定]";
            
            if (!rules) {
                showToast("请填写格式要求！", "error");
                return;
            }

            const prompt = `请帮我撰写一篇学术论文，题目是《${topic}》。

以下是这篇论文必须严格遵守的排版要求：
===
${rules}
===

为了方便我使用解析器转换格式，请你扮演“排版标记引擎”，务必遵守以下【严格指令】：
1. 在每一个独立段落的最开头，加上格式为 [注：排版要求] 的标签。必须把“字体、字号、加粗、对齐、首行缩进、行距”等关键字写进括号里。
2. 绝对不要使用 Markdown 的多级标题（如 #、## 等），所有标题均当做普通文本，靠 [注：...] 标签来控制样式。
3. 【关键修复指令】：对于【摘要】和【关键词】，段落前面的提示标签请只写内容的要求（如 [注：楷体五号，行距固定值22磅]），绝对不要在[注]中写“加粗”。对于前面的“摘要：”或“关键词：”这几个字，请直接使用Markdown的加粗语法（如 **摘要：**）。
4. 标签必须和它所控制的文字在【同一行】。

【正确输出示例】
[注：黑体三号，居中，段前段后0.5行，行距固定值22磅]论文大标题
[注：宋体四号，居中]作者姓名
[注：楷体五号，行距固定值22磅]**摘要：**这里是摘要的具体内容，深入探讨了...
[注：楷体五号，行距固定值22磅]**关键词：**历史观；中华民族；文化认同
[注：宋体小四，首行缩进2字符，行距固定值22磅]这里是普通正文的第一段落内容...
[注：宋体小三加粗，顶格左对齐，段前段后0.5行，行距固定值22磅]一、一级标题内容

请完全理解上述指令，直接输出带有标签的全文：`;

            document.getElementById('generated-prompt').value = prompt;
            showToast("✅ 提示词生成成功！");
        }

        function copyPrompt() {
            const promptEl = document.getElementById('generated-prompt');
            if (!promptEl.value) {
                showToast("请先生成提示词！", "error");
                return;
            }
            promptEl.select();
            document.execCommand('copy');
            showToast("📋 已复制提示词，去发给 AI 吧！");
        }

        // 核心解析逻辑：从中文标签转换为 CSS
        function getCssFromTag(tagStr) {
            let styles = [];
            
            // 字体
            if (tagStr.includes("黑体")) styles.push("font-family:'SimHei', sans-serif");
            else if (tagStr.includes("楷体")) styles.push("font-family:'KaiTi', serif");
            else if (tagStr.includes("仿宋")) styles.push("font-family:'FangSong', serif");
            else if (tagStr.includes("宋体")) styles.push("font-family:'SimSun', serif");
            else styles.push("font-family:'SimSun', serif"); // 兜底宋体
            
            // 字号
            if (tagStr.includes("初号")) styles.push("font-size:42pt");
            else if (tagStr.includes("小初")) styles.push("font-size:36pt");
            else if (tagStr.includes("一号")) styles.push("font-size:26pt");
            else if (tagStr.includes("小一")) styles.push("font-size:24pt");
            else if (tagStr.includes("二号")) styles.push("font-size:22pt");
            else if (tagStr.includes("小二")) styles.push("font-size:18pt");
            else if (tagStr.includes("三号")) styles.push("font-size:16pt");
            else if (tagStr.includes("小三")) styles.push("font-size:15pt");
            else if (tagStr.includes("四号")) styles.push("font-size:14pt");
            else if (tagStr.includes("小四")) styles.push("font-size:12pt");
            else if (tagStr.includes("五号")) styles.push("font-size:10.5pt");
            else if (tagStr.includes("小五")) styles.push("font-size:9pt");
            
            // 加粗
            if (tagStr.includes("加粗") && !tagStr.includes("不加粗")) styles.push("font-weight:bold");
            
            // 对齐
            if (tagStr.includes("居中")) styles.push("text-align:center");
            else if (tagStr.includes("右对齐")) styles.push("text-align:right");
            else if (tagStr.includes("左对齐") || tagStr.includes("顶格")) styles.push("text-align:left");
            
            // 缩进
            if (tagStr.includes("首行缩进") || tagStr.includes("缩进")) {
                const indentMatch = tagStr.match(/缩进(\d+(\.\d+)?)字符/);
                if (indentMatch) {
                    // 小四是 12pt，2字符就是 24pt
                    styles.push(`text-indent:${parseFloat(indentMatch[1]) * 12}pt`); 
                } else {
                    styles.push("text-indent:24pt");
                }
            } else if (tagStr.includes("顶格")) {
                styles.push("text-indent:0");
            }
            
            // 行距
            const lhMatch = tagStr.match(/行距(?:固定值)?(\d+(\.\d+)?)磅/);
            if (lhMatch) {
                styles.push(`mso-line-height-rule:exactly`);
                styles.push(`line-height:${lhMatch[1]}pt`);
            }
            
            // 段前段后
            const marginMatch = tagStr.match(/段前段后(\d+(\.\d+)?)行/);
            if (marginMatch) {
                let lines = parseFloat(marginMatch[1]);
                styles.push(`margin-top:${lines * 15.6}pt`); // 约等于 Word 的 1行 高度
                styles.push(`margin-bottom:${lines * 15.6}pt`);
            } else {
                 styles.push(`margin-top:0`);
                 styles.push(`margin-bottom:0`);
            }

            return styles.join('; ');
        }

        // 步骤 3/4：解析并渲染
        function parseText() {
            let text = document.getElementById('ai-output').value;
            if (!text.trim()) {
                showToast("请先粘贴 AI 生成的内容！", "error");
                return;
            }

            // 过滤掉可能被转义的括号
            text = text.replace(/\\\[/g, '[').replace(/\\\]/g, ']');

            const lines = text.split('\n');
            let html = '';

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                
                // 空行处理
                if (!line) {
                    html += '<div style="font-size:12pt; line-height:22pt;">&nbsp;</div>';
                    continue;
                }

                let currentStyle = "font-family:'SimSun', serif; font-size:12pt; line-height:22pt;"; // 默认兜底
                let content = line;

                // 提取行首的 [注：...]
                const tagMatch = line.match(/^\[注：(.*?)\](.*)$/) || line.match(/^【注：(.*?)】(.*)$/);
                if (tagMatch) {
                    currentStyle = getCssFromTag(tagMatch[1]);
                    content = tagMatch[2].trim();
                }

                // 解决核心 Bug：行内的 Markdown 加粗。专门针对“摘要：”、“关键词：”等。
                // 要求其为 黑体 (SimHei) 加粗
                content = content.replace(/\*\*(.*?)\*\*/g, '<span style="font-weight: bold; font-family: \'SimHei\', sans-serif;">$1</span>');

                html += `<div style="${currentStyle}">${content}</div>`;
            }
            
            document.getElementById('word-preview').innerHTML = html;
            showToast("✨ 渲染成功！右侧预览已更新。");
        }

        // 导出到 Word
        function copyToWord() {
            const preview = document.getElementById('word-preview');
            if (preview.querySelector('#placeholder-text')) {
                showToast("还没有解析内容哦！", "error");
                return;
            }
            
            const range = document.createRange();
            range.selectNodeContents(preview);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            
            try {
                document.execCommand('copy');
                showToast("🎉 复制成功！直接去 Word 保留原格式粘贴即可。");
            } catch (err) {
                showToast("复制失败，请手动框选预览区复制。", "error");
            }
            selection.removeAllRanges();
        }
    </script>
</body>
</html>
